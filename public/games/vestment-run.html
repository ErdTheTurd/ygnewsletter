<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vestment run · EP</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/games/common.js"></script>
  <script>
    const COLORS = {
      white: "#e8e0d4",
      red: "#9b2c2c",
      green: "#2f5d3a",
      violet: "#5a3d6e",
      black: "#1a1a1a",
      rose: "#c47a8a",
    };
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Vestment run");
    let feasts = [];
    let lane = 1;
    let score = 0;
    let running = false;
    let items = [];
    let feast = null;
    let raf = null;
    let lastSpawn = 0;

    function meta() {
      document.getElementById("game-meta").textContent =
        EP.i18n.t("game_score") + ": " + score + " · " + EP.i18n.t("game_best") + ": " + EP.games.getBest("vestment");
    }

    function laneX(l, width) {
      const pad = width / 6;
      return pad + l * ((width - 2 * pad) / 2) - 24;
    }

    function startGame() {
      score = 0;
      lane = 1;
      items = [];
      running = true;
      feast = feasts[Math.floor(Math.random() * feasts.length)];
      meta();
      const board = document.getElementById("game-board");
      board.innerHTML = `<div class="lanes" id="lanes"><div class="lane-feast" id="feast-label"></div><div class="lane-player" id="player"></div></div>
        <p style="color:var(--muted);font-size:0.85rem;margin-top:0.75rem">← → or tap sides</p>`;
      document.getElementById("feast-label").textContent = EP.i18n.pick(feast.feast);
      const lanes = document.getElementById("lanes");
      const player = document.getElementById("player");
      function placePlayer() {
        player.style.left = laneX(lane, lanes.clientWidth) + "px";
      }
      placePlayer();
      function move(dir) {
        lane = Math.max(0, Math.min(2, lane + dir));
        placePlayer();
      }
      window.onkeydown = (e) => {
        if (e.key === "ArrowLeft") move(-1);
        if (e.key === "ArrowRight") move(1);
      };
      lanes.addEventListener("click", (e) => {
        move(e.clientX < lanes.getBoundingClientRect().left + lanes.clientWidth / 2 ? -1 : 1);
      });

      let last = performance.now();
      lastSpawn = last;
      function tick(now) {
        if (!running) return;
        const dt = now - last;
        last = now;
        if (now - lastSpawn > 900) {
          lastSpawn = now;
          const colorKeys = Object.keys(COLORS);
          const color = colorKeys[Math.floor(Math.random() * colorKeys.length)];
          const el = document.createElement("div");
          el.className = "lane-item";
          el.style.background = COLORS[color];
          el.style.top = "-40px";
          el.dataset.color = color;
          el.dataset.lane = String(Math.floor(Math.random() * 3));
          el.style.left = laneX(Number(el.dataset.lane), lanes.clientWidth) + "px";
          lanes.appendChild(el);
          items.push({ el, y: -40, lane: Number(el.dataset.lane), color });
        }
        const speed = 0.18 + score * 0.004;
        items.forEach((it) => {
          it.y += speed * dt;
          it.el.style.top = it.y + "px";
        });
        const hitY = lanes.clientHeight - 70;
        items = items.filter((it) => {
          if (it.y > hitY && it.y < hitY + 40 && it.lane === lane) {
            if (it.color === feast.color) {
              score++;
              EP.games.setBest("vestment", score);
              feast = feasts[Math.floor(Math.random() * feasts.length)];
              document.getElementById("feast-label").textContent = EP.i18n.pick(feast.feast);
              meta();
            } else {
              running = false;
              document.getElementById("feast-label").textContent = EP.i18n.t("game_score") + ": " + score;
            }
            it.el.remove();
            return false;
          }
          if (it.y > lanes.clientHeight) {
            it.el.remove();
            return false;
          }
          return true;
        });
        raf = requestAnimationFrame(tick);
      }
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_start"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);

    EP.api.get("/api/games").then((data) => {
      feasts = data.vestments || [];
      meta();
      startGame();
    });
  </script>
</body>
</html>
