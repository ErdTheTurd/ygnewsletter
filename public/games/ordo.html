<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordo scramble · EP</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/games/common.js"></script>
  <script>
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Ordo scramble");
    let order = [];
    let current = [];
    let start = 0;
    let dragIndex = null;

    function updateMeta() {
      const best = EP.games.getBestTime("ordo");
      document.getElementById("game-meta").textContent =
        EP.i18n.t("game_best") + ": " + (best ? (best / 1000).toFixed(1) + "s" : "-");
    }

    function render() {
      const board = document.getElementById("game-board");
      board.innerHTML = '<ul class="ordo-list" id="ordo-list"></ul><p id="ordo-msg"></p>';
      const list = document.getElementById("ordo-list");
      current.forEach((item, idx) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.textContent = EP.i18n.pick(item);
        li.dataset.idx = idx;
        li.addEventListener("dragstart", () => { dragIndex = idx; li.classList.add("is-active"); });
        li.addEventListener("dragend", () => li.classList.remove("is-active"));
        li.addEventListener("dragover", (e) => e.preventDefault());
        li.addEventListener("drop", () => {
          const to = idx;
          if (dragIndex === null || dragIndex === to) return;
          const [moved] = current.splice(dragIndex, 1);
          current.splice(to, 0, moved);
          dragIndex = null;
          render();
        });
        // tap swap for mobile: select then tap target
        li.addEventListener("click", () => {
          if (dragIndex === null) {
            dragIndex = idx;
            li.classList.add("is-active");
          } else {
            const from = dragIndex;
            dragIndex = null;
            if (from !== idx) {
              const [moved] = current.splice(from, 1);
              current.splice(idx, 0, moved);
            }
            render();
          }
        });
        list.appendChild(li);
      });
    }

    function startGame() {
      current = EP.games.shuffle(order);
      start = Date.now();
      dragIndex = null;
      render();
    }

    function check() {
      const ok = current.every((item, i) => item === order[i]);
      const msg = document.getElementById("ordo-msg");
      if (ok) {
        const ms = Date.now() - start;
        EP.games.setBestTime("ordo", ms);
        updateMeta();
        msg.textContent = EP.i18n.t("game_correct") + " · " + (ms / 1000).toFixed(1) + "s";
        msg.style.color = "var(--gold)";
      } else {
        msg.textContent = EP.i18n.t("game_wrong");
        msg.style.color = "#d98989";
      }
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_again"></button>
       <button class="btn btn--ghost" id="check-btn" data-i18n="game_check"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("check-btn").addEventListener("click", check);

    EP.api.get("/api/games").then((data) => {
      order = data.ordo || [];
      updateMeta();
      startGame();
    });
    window.addEventListener("ep:lang", () => { updateMeta(); render(); });
  </script>
</body>
</html>
