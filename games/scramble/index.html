<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var path = location.pathname;
  if (!/\/404\.html$/.test(path) && /\/index\.html$/.test(path)) {
    location.replace(path.replace(/\/index\.html$/, "/") + location.search + location.hash);
    return;
  }
  if (!/\/404\.html$/.test(path) && /\.html$/.test(path)) {
    location.replace(path.replace(/\.html$/, "") + location.search + location.hash);
    return;
  }
  var base = "/";
  if (path === "/ygnewsletter" || path.indexOf("/ygnewsletter/") === 0) base = "/ygnewsletter/";
  window.EP_BASE = base;
  window.EP = window.EP || {};
  window.EP.url = function (p) {
    if (p == null || p === "") return p;
    if (/^(?:[a-z]+:|\/\/|#|\?)/i.test(p)) return p;
    var root = window.EP_BASE || "/";
    if (p.charAt(0) === "/") return root.replace(/\/$/, "") + p;
    return root + p;
  };
  document.write('<base href="' + base + '">');
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word scramble · EP</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/games/common.js"></script>
  <script>
    const WORDS = [
      { en: "sunset", es: "ocaso" },
      { en: "cactus", es: "cactus" },
      { en: "river", es: "rio" },
      { en: "guitar", es: "guitarra" },
      { en: "mountain", es: "montana" },
      { en: "bridge", es: "puente" },
      { en: "thunder", es: "trueno" },
      { en: "coyote", es: "coyote" },
      { en: "market", es: "mercado" },
      { en: "pepper", es: "chile" },
      { en: "desert", es: "desierto" },
      { en: "soccer", es: "futbol" }
    ];
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Word scramble");
    let deck = [];
    let answer = "";
    let pool = [];
    let guess = [];
    let score = 0;

    function word() {
      const item = deck[0];
      return EP.i18n.getLang() === "es" ? item.es : item.en;
    }

    function meta() {
      document.getElementById("game-meta").textContent =
        EP.i18n.t("game_score") + ": " + score + " · " +
        EP.i18n.t("game_best") + ": " + EP.games.getBest("scramble");
    }

    function scramble(text) {
      const letters = text.split("");
      let mixed = letters.join("");
      while (mixed === text) mixed = EP.games.shuffle(letters).join("");
      return mixed.split("");
    }

    function render() {
      const board = document.getElementById("game-board");
      board.innerHTML = '<div class="guess-row" id="guess"></div><div class="letter-row" id="pool"></div>';
      const guessRow = document.getElementById("guess");
      const poolRow = document.getElementById("pool");
      guess.forEach((letter, i) => {
        const chip = document.createElement("span");
        chip.textContent = letter;
        chip.addEventListener("click", () => {
          pool.push(guess.splice(i, 1)[0]);
          render();
        });
        guessRow.appendChild(chip);
      });
      pool.forEach((letter, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = letter;
        btn.addEventListener("click", () => {
          guess.push(pool.splice(i, 1)[0]);
          render();
          if (pool.length === 0) check();
        });
        poolRow.appendChild(btn);
      });
    }

    function check() {
      if (guess.join("") === answer) {
        score++;
        EP.games.setBest("scramble", score);
        deck.shift();
        meta();
        if (!deck.length) {
          document.getElementById("game-board").innerHTML =
            `<div class="flash-card"><div class="prompt">${score}</div></div>`;
          return;
        }
        next();
      } else {
        score = Math.max(0, score - 1);
        meta();
        pool = guess.splice(0).concat(pool);
        pool = EP.games.shuffle(pool);
        render();
      }
    }

    function next() {
      answer = word();
      pool = scramble(answer);
      guess = [];
      render();
    }

    function startGame() {
      score = 0;
      deck = EP.games.shuffle(WORDS);
      meta();
      next();
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_again"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);
    startGame();
    window.addEventListener("ep:lang", startGame);
  </script>
</body>
</html>
