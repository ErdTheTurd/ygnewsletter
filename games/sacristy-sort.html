<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var path = location.pathname;
  var base = "/";
  if (path === "/ygnewsletter" || path.indexOf("/ygnewsletter/") === 0) base = "/ygnewsletter/";
  window.EP_BASE = base;
  window.EP = window.EP || {};
  window.EP.url = function (p) {
    if (p == null || p === "") return p;
    if (/^(?:[a-z]+:|\/\/|#|\?)/i.test(p)) return p;
    var root = window.EP_BASE || "/";
    if (p.charAt(0) === "/") return root.replace(/\/$/, "") + p;
    return root + p;
  };
  document.write('<base href="' + base + '">');
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sacristy sort · EP</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/games/common.js"></script>
  <script>
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Sacristy sort");
    let items = [];
    let placements = {};
    let start = 0;
    let dragId = null;

    function meta() {
      const best = EP.games.getBestTime("sacristy");
      document.getElementById("game-meta").textContent =
        EP.i18n.t("game_best") + ": " + (best ? (best / 1000).toFixed(1) + "s" : "-");
    }

    function render() {
      const board = document.getElementById("game-board");
      const tray = items.filter((i) => !placements[i.id]);
      board.innerHTML = `
        <div class="zones">
          <div class="zone" data-zone="altar" id="zone-altar"><h3>Altar</h3></div>
          <div class="zone" data-zone="credence" id="zone-credence"><h3>Credence</h3></div>
        </div>
        <div id="tray"></div>
        <p id="sort-msg"></p>`;
      ["altar", "credence"].forEach((z) => {
        const zone = document.getElementById("zone-" + z);
        zone.addEventListener("dragover", (e) => e.preventDefault());
        zone.addEventListener("drop", () => place(dragId, z));
        zone.addEventListener("click", () => { if (dragId) place(dragId, z); });
        items
          .filter((i) => placements[i.id] === z)
          .forEach((i) => zone.appendChild(pieceEl(i)));
      });
      const trayEl = document.getElementById("tray");
      tray.forEach((i) => trayEl.appendChild(pieceEl(i)));
    }

    function pieceEl(item) {
      const el = document.createElement("span");
      el.className = "piece";
      el.draggable = true;
      el.textContent = EP.i18n.pick(item.label);
      el.addEventListener("dragstart", () => { dragId = item.id; });
      el.addEventListener("click", () => {
        dragId = dragId === item.id ? null : item.id;
        document.querySelectorAll(".piece").forEach((p) => p.style.outline = "");
        if (dragId) el.style.outline = "1px solid var(--gold)";
      });
      return el;
    }

    function place(id, zone) {
      if (!id) return;
      placements[id] = zone;
      dragId = null;
      render();
      const done = items.every((i) => placements[i.id]);
      if (done) check();
    }

    function check() {
      const ok = items.every((i) => placements[i.id] === i.zone);
      const msg = document.getElementById("sort-msg");
      if (ok) {
        const ms = Date.now() - start;
        EP.games.setBestTime("sacristy", ms);
        updateMetaSafe();
        msg.textContent = EP.i18n.t("game_correct") + " · " + (ms / 1000).toFixed(1) + "s";
        msg.style.color = "var(--gold)";
      } else {
        msg.textContent = EP.i18n.t("game_wrong");
        msg.style.color = "#d98989";
        // reset wrong ones back to tray
        items.forEach((i) => {
          if (placements[i.id] !== i.zone) delete placements[i.id];
        });
        setTimeout(render, 600);
      }
    }

    function updateMetaSafe() { meta(); }

    function startGame() {
      placements = {};
      start = Date.now();
      items = EP.games.shuffle(items);
      render();
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_again"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);

    EP.api.get("/api/games").then((data) => {
      items = (data.sacristy && data.sacristy.items) || [];
      meta();
      startGame();
    });
    window.addEventListener("ep:lang", render);
  </script>
</body>
</html>
