<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var path = location.pathname;
  if (!/\/404\.html$/.test(path) && /\/index\.html$/.test(path)) {
    location.replace(path.replace(/\/index\.html$/, "/") + location.search + location.hash);
    return;
  }
  if (!/\/404\.html$/.test(path) && /\.html$/.test(path)) {
    location.replace(path.replace(/\.html$/, "") + location.search + location.hash);
    return;
  }
  var base = "/";
  if (path === "/ygnewsletter" || path.indexOf("/ygnewsletter/") === 0) base = "/ygnewsletter/";
  window.EP_BASE = base;
  window.EP = window.EP || {};
  window.EP.url = function (p) {
    if (p == null || p === "") return p;
    if (/^(?:[a-z]+:|\/\/|#|\?)/i.test(p)) return p;
    var root = window.EP_BASE || "/";
    if (p.charAt(0) === "/") return root.replace(/\/$/, "") + p;
    return root + p;
  };
  document.write('<base href="' + base + '">');
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordo scramble · EP</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/games/common.js"></script>
  <script>
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Ordo scramble");
    let order = [];
    let current = [];
    let start = 0;
    let dragIndex = null;

    function updateMeta() {
      const best = EP.games.getBestTime("ordo");
      document.getElementById("game-meta").textContent =
        EP.i18n.t("game_best") + ": " + (best ? (best / 1000).toFixed(1) + "s" : "-");
    }

    function render() {
      const board = document.getElementById("game-board");
      board.innerHTML = '<p class="game-help" id="ordo-help"></p><ul class="ordo-list" id="ordo-list"></ul><p id="ordo-msg"></p>';
      document.getElementById("ordo-help").textContent = EP.i18n.t("ordo_help");
      const list = document.getElementById("ordo-list");
      function move(from, to) {
        if (from == null || to < 0 || to >= current.length || from === to) return;
        const [moved] = current.splice(from, 1);
        current.splice(to, 0, moved);
        dragIndex = null;
        render();
      }
      current.forEach((item, idx) => {
        const li = document.createElement("li");
        li.draggable = true;
        const label = document.createElement("span");
        label.textContent = EP.i18n.pick(item);
        const up = document.createElement("button");
        up.type = "button";
        up.className = "ordo-move";
        up.textContent = "↑";
        up.addEventListener("click", (e) => { e.stopPropagation(); move(idx, idx - 1); });
        const down = document.createElement("button");
        down.type = "button";
        down.className = "ordo-move";
        down.textContent = "↓";
        down.addEventListener("click", (e) => { e.stopPropagation(); move(idx, idx + 1); });
        li.append(label, up, down);
        li.addEventListener("dragstart", () => { dragIndex = idx; li.classList.add("is-active"); });
        li.addEventListener("dragend", () => li.classList.remove("is-active"));
        li.addEventListener("dragover", (e) => e.preventDefault());
        li.addEventListener("drop", () => move(dragIndex, idx));
        list.appendChild(li);
      });
    }

    function startGame() {
      current = EP.games.shuffle(order);
      start = Date.now();
      dragIndex = null;
      render();
    }

    function check() {
      const ok = current.every((item, i) => item === order[i]);
      const msg = document.getElementById("ordo-msg");
      if (ok) {
        const ms = Date.now() - start;
        EP.games.setBestTime("ordo", ms);
        updateMeta();
        msg.textContent = EP.i18n.t("game_correct") + " · " + (ms / 1000).toFixed(1) + "s";
        msg.style.color = "var(--gold)";
      } else {
        msg.textContent = EP.i18n.t("game_wrong");
        msg.style.color = "#d98989";
      }
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_again"></button>
       <button class="btn btn--ghost" id="check-btn" data-i18n="game_check"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("check-btn").addEventListener("click", check);

    EP.api.get("/api/games").then((data) => {
      order = data.ordo || [];
      updateMeta();
      startGame();
    });
    window.addEventListener("ep:lang", () => { updateMeta(); render(); });
  </script>
</body>
</html>
