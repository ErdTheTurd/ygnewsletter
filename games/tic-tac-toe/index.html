<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var path = location.pathname;
  if (!/\/404\.html$/.test(path) && /\/index\.html$/.test(path)) {
    location.replace(path.replace(/\/index\.html$/, "/") + location.search + location.hash);
    return;
  }
  if (!/\/404\.html$/.test(path) && /\.html$/.test(path)) {
    location.replace(path.replace(/\.html$/, "") + location.search + location.hash);
    return;
  }
  var base = "/";
  if (path === "/ygnewsletter" || path.indexOf("/ygnewsletter/") === 0) base = "/ygnewsletter/";
  window.EP_BASE = base;
  window.EP = window.EP || {};
  window.EP.url = function (p) {
    if (p == null || p === "") return p;
    if (/^(?:[a-z]+:|\/\/|#|\?)/i.test(p)) return p;
    var root = window.EP_BASE || "/";
    if (p.charAt(0) === "/") return root.replace(/\/$/, "") + p;
    return root + p;
  };
  document.write('<base href="' + base + '">');
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-tac-toe · EP</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main id="game-root"></main>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/games/common.js"></script>
  <script>
    const root = document.getElementById("game-root");
    root.innerHTML = EP.games.shell("Tic-tac-toe");
    const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board = [];
    let locked = false;

    function result(cells) {
      for (const [a, b, c] of LINES) {
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a];
      }
      return cells.every(Boolean) ? "draw" : null;
    }

    function minimax(cells, aiTurn) {
      const done = result(cells);
      if (done === "O") return { score: 1 };
      if (done === "X") return { score: -1 };
      if (done === "draw") return { score: 0 };
      let best = { score: aiTurn ? -2 : 2, index: -1 };
      cells.forEach((cell, i) => {
        if (cell) return;
        cells[i] = aiTurn ? "O" : "X";
        const next = minimax(cells, !aiTurn);
        cells[i] = "";
        if (aiTurn && next.score > best.score) best = { score: next.score, index: i };
        if (!aiTurn && next.score < best.score) best = { score: next.score, index: i };
      });
      return best;
    }

    function meta(text) {
      const wins = EP.games.getBest("ttt");
      document.getElementById("game-meta").textContent =
        (text ? text + " · " : "") + "Wins: " + wins;
    }

    function paint() {
      const grid = document.getElementById("ttt");
      grid.querySelectorAll("button").forEach((btn, i) => {
        btn.textContent = board[i];
        btn.disabled = locked || !!board[i];
      });
    }

    function finish(state) {
      locked = true;
      if (state === "X") {
        EP.games.setBest("ttt", EP.games.getBest("ttt") + 1);
        meta("You win");
      } else if (state === "O") {
        meta("Computer wins");
      } else {
        meta("Draw");
      }
      paint();
    }

    function play(i) {
      if (locked || board[i]) return;
      board[i] = "X";
      let state = result(board);
      if (state) return finish(state);
      const move = minimax(board.slice(), true).index;
      if (move >= 0) board[move] = "O";
      state = result(board);
      paint();
      if (state) finish(state);
    }

    function startGame() {
      board = Array(9).fill("");
      locked = false;
      meta("");
      document.getElementById("game-board").innerHTML = '<div class="ttt" id="ttt"></div>';
      const grid = document.getElementById("ttt");
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.addEventListener("click", () => play(i));
        grid.appendChild(btn);
      }
      paint();
    }

    document.getElementById("game-actions").innerHTML =
      `<button class="btn" id="start-btn" data-i18n="game_again"></button>`;
    EP.i18n.apply();
    document.getElementById("start-btn").addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
