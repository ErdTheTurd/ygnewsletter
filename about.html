<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  var path = location.pathname;
  var base = "/";
  if (path === "/ygnewsletter" || path.indexOf("/ygnewsletter/") === 0) base = "/ygnewsletter/";
  window.EP_BASE = base;
  window.EP = window.EP || {};
  window.EP.url = function (p) {
    if (p == null || p === "") return p;
    if (/^(?:[a-z]+:|\/\/|#|\?)/i.test(p)) return p;
    var root = window.EP_BASE || "/";
    if (p.charAt(0) === "/") return root.replace(/\/$/, "") + p;
    return root + p;
  };
  document.write('<base href="' + base + '">');
})();
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

    </div>

</html>
