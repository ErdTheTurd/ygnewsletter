name: Publish newsletter edit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: newsletter-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.issue.title, 'newsletter:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.issue.user.login == 'ErdTheTurd' && github.event.issue.author_association == 'OWNER'
      - name: Apply the edit
        id: apply
        if: github.event.issue.user.login == 'ErdTheTurd' && github.event.issue.author_association == 'OWNER'
        run: node scripts/apply-newsletter-edit.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          EDIT_RESULT: ${{ runner.temp }}/edit-result.json
        continue-on-error: true
      - name: Commit published files
        if: steps.apply.outcome == 'success'
        run: |
          git add data api
          if [ -d issues ]; then git add issues; fi
          if [ -d uploads ]; then git add uploads; fi
          if git diff --cached --quiet; then
            echo "No file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish newsletter edit"
          git push
      - name: Close the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const applied = "${{ steps.apply.outcome }}" === "success";
            const body = applied
              ? "Published. The public page updates when GitHub Pages finishes this push."
              : "This issue was not published.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
